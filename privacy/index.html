<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<script>
(function(){try{var t=localStorage.getItem("raseekh_theme");document.documentElement.setAttribute("data-theme",t==="soft"?"soft":"base");}catch(e){document.documentElement.setAttribute("data-theme","base");}})();
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سياسة الخصوصية — راسخ</title>
<meta name="description" content="سياسة الخصوصية لموقع راسخ: حلول للشركات، صيانة مواقع، برمجة، تطبيقات مخزون، وأنظمة ولوحات تحكم.">
<meta name="theme-color" content="#ffffff">
<link rel="canonical" href="https://raseekh.com/privacy/">
<link rel="alternate" hreflang="ar" href="https://raseekh.com/privacy/">
<link rel="alternate" hreflang="en" href="https://raseekh.com/privacy/?lang=en">
<link rel="alternate" hreflang="x-default" href="https://raseekh.com/privacy/">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=Tajawal:wght@500;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="/terms.js"></script>
<script src="/theme.js"></script>
<style>
:root{
  --ink:#10233A;--navy:#16324F;--harbor:#2A6F7A;--copper:#C45C26;--sand:#E8A05A;
  --bg:#FFFFFF;--panel:#FFFFFF;--line:#E4E8EE;--muted:#5A6B7C;--radius:6px;
  --shadow:0 14px 34px -26px rgba(16,35,58,.28);
  --header-bg:rgba(255,255,255,.92);--surface-tint:#FAFBFC;--mist:#F2F4F7;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Readex Pro','Tajawal',sans-serif;line-height:1.75;min-height:100vh;
}
body.lang-en{font-family:'Space Grotesk',sans-serif}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 70% 40% at 100% 0%, rgba(196,92,38,.07), transparent 50%),
    radial-gradient(ellipse 60% 35% at 0% 10%, rgba(42,111,122,.07), transparent 50%),
    linear-gradient(180deg,#FFFFFF,var(--surface-tint,#FAFBFC));
}
.wrap{max-width:800px;margin:0 auto;padding:28px 22px 60px;position:relative;z-index:1}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:28px;
}
.logo{font-family:'Tajawal',sans-serif;font-size:1.6rem;font-weight:800;color:var(--navy);text-decoration:none}
body.lang-en .logo{font-family:'Space Grotesk',sans-serif}
.logo em{font-style:normal;color:var(--copper)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nav-prefs{display:inline-flex;align-items:center;gap:6px}
.theme-switch{display:inline-flex;align-items:stretch;border:1.5px solid var(--line);border-radius:var(--radius);background:var(--ghost-bg,#fff);overflow:hidden;padding:2px;gap:2px}
.theme-switch [data-theme-set]{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.74rem;font-weight:700;padding:7px 10px;border-radius:4px;cursor:pointer}
.theme-switch [data-theme-set].is-active{background:var(--panel);color:var(--harbor)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  border:none;border-radius:var(--radius);padding:11px 16px;cursor:pointer;font-weight:700;text-decoration:none;
}
.btn-primary{background:var(--copper);color:#fff}
.btn-primary:hover{background:#A84C1E}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.eyebrow{display:inline-flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--copper);display:inline-block}
.lang-btn,.theme-btn{
  border:1.5px solid var(--line);background:var(--panel);border-radius:var(--radius);
  padding:9px 12px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--ink);min-width:3.2rem;
}
.theme-btn:hover{border-color:rgba(196,92,38,.45);color:var(--copper)}
.theme-btn[aria-pressed="true"]{border-color:rgba(42,111,122,.45);color:var(--harbor)}
.panel{
  background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:28px 22px;
  box-shadow:var(--shadow);border-top:4px solid var(--copper);
}
.eyebrow{color:var(--copper);font-weight:700;font-size:.8rem;margin-bottom:8px}
.terms-doc-head h2{font-size:clamp(1.7rem,3vw,2.3rem);color:var(--navy);margin-bottom:10px}
.terms-doc-head p{color:var(--muted);margin-bottom:8px}
.terms-updated{color:var(--copper);font-weight:700;font-size:.82rem;margin-bottom:18px}
.terms-list{display:flex;flex-direction:column}
.terms-item{padding:16px 0;border-bottom:1.5px solid var(--line)}
.terms-item:last-child{border-bottom:none}
.terms-item h3{color:var(--navy);font-size:1.05rem;margin-bottom:8px}
.terms-item p{color:var(--muted);font-size:.95rem;line-height:1.8}
h1,h2,h3{font-family:'Tajawal',sans-serif}
body.lang-en h1,body.lang-en h2,body.lang-en h3{font-family:'Space Grotesk',sans-serif}
</style>
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="wrap">
    <div class="top">
      <a class="logo" href="/" data-ar-html='را<em>سخ</em>' data-en-html='Ra<em>seekh</em>'>را<em>سخ</em></a>
      <div class="actions">
      <div class="nav-prefs" role="group" data-ar-aria="اللغة والمظهر" data-en-aria="Language and theme" aria-label="اللغة والمظهر">
        <button class="lang-btn" id="langToggle" type="button">EN</button>
        <div class="theme-switch" role="group" data-ar-aria="الشمس أو القمر" data-en-aria="Sun or Moon look" aria-label="الشمس أو القمر">
          <button type="button" data-theme-set="base" class="is-active" aria-pressed="true" data-ar-aria="مظهر الشمس — أبيض ساطع" data-en-aria="Sun look — bright white" aria-label="مظهر الشمس — أبيض ساطع" title="مظهر الشمس — أبيض ساطع"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"/></g></svg><span data-theme-label data-ar="شمس" data-en="Sun">شمس</span></button>
          <button type="button" data-theme-set="soft" aria-pressed="false" data-ar-aria="مظهر القمر — رمادي ناعم" data-en-aria="Moon look — soft mist" aria-label="مظهر القمر — رمادي ناعم" title="مظهر القمر — رمادي ناعم"><svg class="theme-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M14.6 3.2a8.8 8.8 0 1 0 6.2 14.7A7.2 7.2 0 0 1 14.6 3.2z"/></svg><span data-theme-label data-ar="قمر" data-en="Moon">قمر</span></button>
        </div>
      </div>
        <a class="btn btn-ghost" href="/terms/" data-ar="الشروط" data-en="Terms">الشروط</a>
        <a class="btn btn-ghost" href="/security/" data-ar="الأمان" data-en="Security">الأمان</a>
        <a class="btn btn-ghost" href="/" data-ar="الرئيسية" data-en="Home">الرئيسية</a>
        <a class="btn btn-primary" href="/dashboard/" data-ar="حسابي" data-en="My account">حسابي</a>
      </div>
    </div>
    <div class="panel" id="privacyRoot"></div>
  </div>
<script>
(function(){
  let currentLang = localStorage.getItem('raseekh_lang') || 'ar';
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'ar') currentLang = q;
  const Terms = window.RaseekhTerms;
  if (Terms) Terms.renderPrivacyInto(document.getElementById('privacyRoot'));

  function applyLang(lang){
    currentLang = lang;
    localStorage.setItem('raseekh_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.body.classList.toggle('lang-en', lang === 'en');
    document.querySelectorAll('[data-ar]').forEach((el) => {
      const v = lang === 'ar' ? el.getAttribute('data-ar') : el.getAttribute('data-en');
      if (v !== null) el.textContent = v;
    });
    document.querySelectorAll('[data-ar-html]').forEach((el) => {
      const v = lang === 'ar' ? el.getAttribute('data-ar-html') : el.getAttribute('data-en-html');
      if (v !== null) el.innerHTML = v;
    });
    document.getElementById('langToggle').textContent = lang === 'ar' ? 'EN' : 'AR';
    if (window.RaseekhTheme && RaseekhTheme.apply) RaseekhTheme.apply(RaseekhTheme.get());
    document.title = lang === 'ar' ? 'سياسة الخصوصية — راسخ' : 'Privacy Policy — Raseekh';
    const canonical = document.querySelector('link[rel="canonical"]');
    if (canonical) canonical.setAttribute('href', lang === 'en' ? 'https://raseekh.com/privacy/?lang=en' : 'https://raseekh.com/privacy/');
  }
  document.getElementById('langToggle').addEventListener('click', () => applyLang(currentLang === 'ar' ? 'en' : 'ar'));
  applyLang(currentLang);
})();
</script>
  </body>
</html>
